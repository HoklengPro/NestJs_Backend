version: '3.8'

services:
  tp02-postgres:
    image: postgres:16
    container_name: tp02_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tp02
    ports:
      - '5433:5432'
    volumes:
      - tp02_pgdata:/var/lib/postgresql/data

volumes:
  tp02_pgdata:
